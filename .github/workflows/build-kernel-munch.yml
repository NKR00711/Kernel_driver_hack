name: Build Munch Kernel Module

on:
  workflow_dispatch:
    inputs:
      kernel_zip_url:
        description: "URL to your kernel flashable ZIP (from Build Kernel workflow)"
        required: true
        default: ""
        type: string
      defconfig:
        description: "Defconfig name"
        required: true
        default: "munch_defconfig"
        type: string
      module_path:
        description: "Path to your module source in the repo"
        required: true
        default: "kernel"
        type: string

jobs:
  build-module:
    runs-on: ubuntu-latest
    # NO container - use the host Ubuntu directly like your kernel build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 wget unzip

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        if [ ! -d "Clang-16.0.6-20260510-release" ]; then
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -zxvf Clang-16.0.6-20260510.tar.gz
          rm Clang-16.0.6-20260510.tar.gz
        fi
        echo "$HOME/zyc-clang/Clang-16.0.6-20260510-release/bin" >> $GITHUB_PATH

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-module-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-module-ccache-

    - name: Download Kernel Source
      run: |
        git clone --depth=1 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 -b v20260417-c0fd5eb8 kernel_source || {
          echo "Branch not found, cloning default..."
          git clone --depth=1 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel_source
        }
        echo "Kernel commit: $(git -C kernel_source rev-parse --short HEAD)"

    - name: Download Kernel Build Artifacts
      run: |
        mkdir -p kernel_artifacts
        
        if [ -n "${{ inputs.kernel_zip_url }}" ]; then
          echo "Downloading kernel ZIP from URL..."
          wget -O kernel_artifacts/kernel.zip "${{ inputs.kernel_zip_url }}"
        else
          echo "ERROR: Please provide the kernel ZIP URL"
          echo "Get it from: https://github.com/${{ github.repository }}/actions"
          exit 1
        fi
        
        cd kernel_artifacts
        unzip -q kernel.zip -d extracted/
        echo "Kernel artifacts extracted:"
        ls -la extracted/

    - name: Setup Kernel Build Tree
      run: |
        cd kernel_source
        
        export ARCH=arm64
        export PATH="$HOME/zyc-clang/Clang-16.0.6-20260510-release/bin:${PATH}"
        
        # Create out directory
        mkdir -p out
        
        # Copy kernel config and Module.symvers from artifacts
        if [ -f "../kernel_artifacts/extracted/.config" ]; then
          cp ../kernel_artifacts/extracted/.config out/.config
          echo "✅ Found .config in artifacts"
        fi
        
        if [ -f "../kernel_artifacts/extracted/Module.symvers" ]; then
          cp ../kernel_artifacts/extracted/Module.symvers out/Module.symvers
          echo "✅ Found Module.symvers in artifacts"
        fi
        
        # If no .config found, generate from defconfig
        if [ ! -f "out/.config" ]; then
          echo "⚠️ No .config found in artifacts, generating from defconfig..."
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- ${{ inputs.defconfig }}
        fi
        
        # Get kernel vermagic
        KERNEL_VER=$(make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null | tail -1)
        echo "Kernel version: $KERNEL_VER"
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

    - name: Copy Module Source to Kernel Tree
      run: |
        cd kernel_source
        
        if [ ! -d "../${{ inputs.module_path }}" ]; then
          echo "❌ Module source not found at: ${{ inputs.module_path }}"
          echo "Available directories:"
          ls -la ../
          exit 1
        fi
        
        rm -rf drivers/hack
        cp -a ../${{ inputs.module_path }} drivers/hack
        
        echo "✅ Module source copied to drivers/hack/"
        ls -la drivers/hack/
        
        if [ ! -f "drivers/hack/Makefile" ]; then
          echo "❌ Makefile not found!"
          exit 1
        fi
        
        if [ ! -f "drivers/hack/Kconfig" ]; then
          cat > drivers/hack/Kconfig << 'EOF'
          config KERNEL_HACK
                  tristate "Kernel Hack Module"
                  help
                    Custom kernel module for munch
          EOF
        fi
        
        grep -q 'source "drivers/hack/Kconfig"' drivers/Kconfig || \
          echo 'source "drivers/hack/Kconfig"' >> drivers/Kconfig
        grep -q 'obj-$(CONFIG_KERNEL_HACK) += hack/' drivers/Makefile || \
          echo 'obj-$(CONFIG_KERNEL_HACK) += hack/' >> drivers/Makefile
        
        export ARCH=arm64
        export PATH="$HOME/zyc-clang/Clang-16.0.6-20260510-release/bin:${PATH}"
        
        scripts/config --file out/.config --enable CONFIG_KERNEL_HACK
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        echo "✅ Module configured"

    - name: Build Module
      run: |
        cd kernel_source
        
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$HOME/zyc-clang/Clang-16.0.6-20260510-release/bin:${PATH}"
        export CC="ccache clang"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        echo "=== Building modules_prepare ==="
        make -j$(nproc) O=out ARCH=arm64 CC="$CC" \
             CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
             LD=ld.lld modules_prepare
        
        echo "=== Building module ==="
        make -j$(nproc) O=out ARCH=arm64 CC="$CC" \
             CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
             LD=ld.lld M=drivers/hack
        
        echo "=== Built modules ==="
        find out/drivers/hack -name "*.ko" -ls

    - name: Verify Vermagic
      id: vermagic_check
      run: |
        cd kernel_source
        
        export ARCH=arm64
        export PATH="$HOME/zyc-clang/Clang-16.0.6-20260510-release/bin:${PATH}"
        
        KERNEL_VER=$(make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null | tail -1)
        
        echo "📦 Kernel Vermagic: $KERNEL_VER"
        
        MODULE_KO=$(find out/drivers/hack -name "*.ko" | head -1)
        if [ -f "$MODULE_KO" ]; then
          MODULE_VER=$(modinfo -F vermagic "$MODULE_KO" 2>/dev/null)
          echo "📦 Module Vermagic: $MODULE_VER"
          
          if [ "$KERNEL_VER" == "$MODULE_VER" ]; then
            echo "✅ VERMAGIC MATCH!"
            echo "vermagic_match=true" >> $GITHUB_OUTPUT
          else
            echo "❌ VERMAGIC MISMATCH!"
            echo "vermagic_match=false" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Package Module
      run: |
        cd kernel_source/out/drivers/hack
        
        KOS=(*.ko)
        if [ ${#KOS[@]} -eq 0 ]; then
          echo "❌ No modules found!"
          exit 1
        fi
        
        VERMAGIC=$(modinfo -F vermagic "${KOS[0]}" 2>/dev/null | tr -d '\n' | sed 's/+/_/g' | sed 's/\//_/g' | sed 's/-/_/g')
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        ZIP_NAME="munch_module_${VERMAGIC}_${TIMESTAMP}.zip"
        
        mkdir -p /module_package
        cp *.ko /module_package/
        
        cat > /module_package/INFO.txt << EOF
        ==========================================
        Kernel Module for Munch
        ==========================================
        Device: munch
        Defconfig: ${{ inputs.defconfig }}
        Vermagic: $VERMAGIC
        Build Date: $(date -u)
        Run ID: ${{ github.run_id }}
        
        Modules: $(ls *.ko)
        ==========================================
        EOF
        
        cd /module_package
        zip -r9 "../${ZIP_NAME}" ./*
        
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "ZIP_PATH=/module_package/${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload Module ZIP
      uses: actions/upload-artifact@v4
      with:
        name: munch-module-${{ github.run_id }}
        path: ${{ env.ZIP_PATH }}
        compression-level: 0

    - name: Upload .ko Files
      uses: actions/upload-artifact@v4
      with:
        name: munch-module-ko-files
        path: kernel_source/out/drivers/hack/*.ko
        compression-level: 0

    - name: Summary
      if: always()
      run: |
        echo "## 📊 Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Device** | munch |" >> $GITHUB_STEP_SUMMARY
        echo "| **Vermagic** | ${{ env.KERNEL_VER }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Match** | ${{ steps.vermagic_check.outputs.vermagic_match }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **ZIP** | \`${{ env.ZIP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
