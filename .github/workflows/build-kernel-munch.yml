name: A Munch Build Kernel Module

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (e.g., munch_defconfig)"
        required: true
        default: "munch_defconfig"
      disable_modversions:
        description: "Disable MODVERSIONS"
        required: false
        default: true
        type: boolean
      vermagic_custom:
        description: "Custom vermagic string (leave empty for auto-detect)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Module Source
      uses: actions/checkout@v4

    - name: Install necessary packages
      run: |
        apt-get update
        export DEBIAN_FRONTEND=noninteractive
        ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
        apt-get install -y tzdata lsb-release
        dpkg-reconfigure --frontend noninteractive tzdata
        apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python2 kmod

    - name: Cache Dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          kernel_source
          clang
          ~/.ccache
        key: ${{ runner.os }}-kernel-munch-${{ hashFiles('**/Makefile', 'kernel/**') }}
        restore-keys: |
          ${{ runner.os }}-kernel-munch-

    - name: Ensure Kernel Source
      run: |
        if [ -d kernel_source/.git ]; then
          echo "kernel_source already prepared"
          cd kernel_source
          git fetch --depth=1 origin v20260417-c0fd5eb8 2>/dev/null || true
          git checkout v20260417-c0fd5eb8 2>/dev/null || git checkout HEAD
          cd ..
        else
          rm -rf kernel_source
          git clone --depth=1 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 -b v20260417-c0fd5eb8 kernel_source || {
            echo "Branch not found, cloning default branch..."
            git clone --depth=1 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel_source
          }
        fi
        echo "Kernel branch: $(git -C kernel_source branch --show-current 2>/dev/null || echo 'detached')"
        echo "Kernel commit: $(git -C kernel_source rev-parse --short HEAD 2>/dev/null || echo 'unknown')"

    - name: Ensure Toolchain
      run: |
        if [ -d clang/.git ]; then
          echo "clang already prepared"
        else
          rm -rf clang
          git clone --depth=1 https://gitlab.com/LeCmnGend/proton-clang.git -b clang-13 clang
        fi

    - name: Set up Environment
      run: |
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
        echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        ccache -M 5G

    - name: Prepare Kernel Source for Module Build
      shell: bash
      working-directory: ./kernel_source
      run: |
        # Get defconfig name from input
        DEFCONFIG="${{ inputs.defconfig }}"
        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG="munch_defconfig"
        fi
        echo "Using defconfig: $DEFCONFIG"
        
        # Check if defconfig exists
        if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
          echo "Error: Defconfig 'arch/arm64/configs/$DEFCONFIG' not found!"
          echo "Available defconfigs:"
          ls arch/arm64/configs/ | grep -E "(_defconfig$|defconfig$)" || echo "No defconfigs found"
          exit 1
        fi
        
        # Handle custom vermagic
        VERMAGIC_CUSTOM="${{ inputs.vermagic_custom }}"
        if [ -n "$VERMAGIC_CUSTOM" ]; then
          echo "=== Using custom vermagic: $VERMAGIC_CUSTOM ==="
          
          BASE_VERSION=$(echo "$VERMAGIC_CUSTOM" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          EXTRA_VERSION=$(echo "$VERMAGIC_CUSTOM" | sed "s/^$BASE_VERSION//")
          
          if [[ "$VERMAGIC_CUSTOM" =~ (g[0-9a-f]{12}) ]]; then
            GIT_HASH="${BASH_REMATCH[1]}"
            echo "Detected git hash: $GIT_HASH"
            EXTRA_VERSION=$(echo "$EXTRA_VERSION" | sed "s/$GIT_HASH//")
          else
            GIT_HASH=""
          fi
          
          EXTRA_VERSION=$(echo "$EXTRA_VERSION" | sed 's/-$//')
          
          echo "BASE_VERSION: $BASE_VERSION"
          echo "EXTRA_VERSION: $EXTRA_VERSION"
          echo "GIT_HASH: $GIT_HASH"
          
          sed -i 's/^VERSION =.*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 325/' Makefile
          
          if [ -n "$EXTRA_VERSION" ]; then
            sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = $EXTRA_VERSION/" Makefile
          else
            sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = /' Makefile
          fi
          
          if [ -n "$GIT_HASH" ]; then
            echo "$GIT_HASH" > .scmversion
          else
            echo "" > .scmversion
          fi
          
          export KBUILD_BUILD_VERSION=""
          export KBUILD_BUILD_TIMESTAMP=""
          
          echo "=== Modified Makefile version ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =" Makefile
        else
          echo "=== No custom vermagic provided, using kernel source default ==="
        fi

        # Reset module directory and sync latest code
        rm -rf drivers/hack
        mkdir -p drivers/hack
        cp -a ../kernel/. drivers/hack/

        # Create Kconfig if it doesn't exist
        if [ ! -f drivers/hack/Kconfig ]; then
          cat > drivers/hack/Kconfig << 'EOF'
          config KERNEL_HACK
                  tristate "Kernel Hack Module"
                  help
                    This is a custom kernel module for memory operations.
                    Say Y/M here to enable the kernel hack module.
          EOF
        fi

        # Add module to Kconfig and Makefile (idempotent)
        grep -q 'source "drivers/hack/Kconfig"' drivers/Kconfig || echo 'source "drivers/hack/Kconfig"' >> drivers/Kconfig
        grep -q 'obj-$(CONFIG_KERNEL_HACK) += hack/' drivers/Makefile || echo 'obj-$(CONFIG_KERNEL_HACK) += hack/' >> drivers/Makefile

        # Configure the kernel
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
        
        # Override CONFIG_LOCALVERSION
        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION ""
        
        # Disable MODVERSIONS if requested
        DISABLE_MODVERSIONS="${{ inputs.disable_modversions }}"
        if [ "$DISABLE_MODVERSIONS" = "true" ] || [ "$DISABLE_MODVERSIONS" = "True" ]; then
          echo "=== Disabling MODVERSIONS ==="
          scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          scripts/config --file out/.config --disable CONFIG_ASM_MODVERSIONS
          scripts/config --file out/.config --disable CONFIG_MODULE_SRCVERSION_ALL
          scripts/config --file out/.config --disable CONFIG_MODULE_FORCE_LOAD
        fi

        # Enable the module config
        scripts/config --file out/.config --enable CONFIG_KERNEL_HACK
        
        # Regenerate config
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # Show kernel version
        echo "=== Kernel version being built ==="
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- kernelrelease

    - name: Build Kernel Module
      shell: bash
      working-directory: ./kernel_source
      run: |
        export KBUILD_BUILD_VERSION=""
        export KBUILD_BUILD_TIMESTAMP=""
        
        echo "=== Building modules_prepare ==="
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld modules_prepare
        
        echo "=== Building kernel module ==="
        # Build with -Wno-error flags to suppress warnings
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld M=drivers/hack \
          EXTRA_CFLAGS="-Wno-error -Wno-unused-variable -Wno-unused-but-set-variable -Wno-missing-attributes -Wno-attributes -Wno-int-conversion -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" || {
            echo "Build with clang failed, trying with gcc..."
            make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/hack \
              EXTRA_CFLAGS="-Wno-error -Wno-unused-variable -Wno-unused-but-set-variable" || exit 1
        }
        
        # Find and show the built modules
        echo "=== Built modules ==="
        find out/drivers/hack -name "*.ko" -ls 2>/dev/null || echo "No modules found!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule
        path: kernel_source/out/drivers/hack/*.ko

    - name: Package Module
      if: success()
      shell: bash
      run: |
        shopt -s nullglob
        KOS=(kernel_source/out/drivers/hack/*.ko)
        if [ ${#KOS[@]} -eq 0 ]; then
          echo "No .ko files found!"
          echo "Checking build output..."
          find kernel_source/out -name "*.ko" 2>/dev/null || echo "No .ko files anywhere"
          exit 1
        fi
        
        echo "Found ${#KOS[@]} module(s)"
        for ko in "${KOS[@]}"; do
          echo "Module: $ko"
          modinfo "$ko" 2>/dev/null || echo "Could not read modinfo"
        done
        
        # Get vermagic from first module
        KO="${KOS[0]}"
        VERMAGIC="$(modinfo -F vermagic "$KO" 2>/dev/null | tr -d '\n' | awk '{print $1}' || echo 'unknown')"
        echo "vermagic: $VERMAGIC"
        
        # Create zip
        KREL="$(echo "$VERMAGIC" | sed 's/+/_/g' | sed 's/\//_/g' | sed 's/-/_/g')"
        ZIPNAME="${KREL}-kernel-module.zip"
        
        mkdir -p dist
        (cd kernel_source/out/drivers/hack && zip -9 "../../../../dist/$ZIPNAME" ./*.ko 2>/dev/null)
        
        echo "Created: dist/$ZIPNAME"
        echo "ZIP_NAME=$ZIPNAME" >> $GITHUB_ENV
        echo "ZIP_PATH=dist/$ZIPNAME" >> $GITHUB_ENV
        echo "VERMAGIC=$VERMAGIC" >> $GITHUB_ENV

    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule-Zip
        path: ${{ env.ZIP_PATH }}
