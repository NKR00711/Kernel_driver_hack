name: Build Kernel Module

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'munch'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      ksu:
        description: 'Enable KernelSU (ReSukiSU) support in module'
        required: true
        type: boolean
        default: false
      module_path:
        description: 'Path to your LKM source code (路径)'
        required: true
        default: 'kernel'
        type: string
      module_config:
        description: 'Kconfig symbol for your module (e.g., CONFIG_KERNEL_HACK)'
        required: true
        default: 'CONFIG_KERNEL_HACK'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Module Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install necessary packages
      run: |
        apt-get update
        export DEBIAN_FRONTEND=noninteractive
        ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
        apt-get install -y tzdata lsb-release
        dpkg-reconfigure --frontend noninteractive tzdata
        apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python2 kmod

    - name: Cache Dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          kernel_source
          clang
          ~/.ccache
        key: ${{ runner.os }}-kernel-munch-${{ hashFiles('**/Makefile', '**/Kconfig') }}
        restore-keys: |
          ${{ runner.os }}-kernel-munch-

    - name: Ensure Kernel Source
      run: |
        if [ -d kernel_source/.git ]; then
          echo "kernel_source already prepared"
          cd kernel_source
          git fetch --depth=1 origin android16-pitchkernel 2>/dev/null || true
          git checkout android16-pitchkernel 2>/dev/null || git checkout HEAD
          cd ..
        else
          rm -rf kernel_source
          git clone --depth=1 --single-branch -b android16-pitchkernel \
            https://github.com/MujinnPark/android_kernel_xiaomi_sm8250.git kernel_source
        fi
        echo "Kernel branch: $(git -C kernel_source branch --show-current 2>/dev/null || echo 'detached')"
        echo "Kernel commit: $(git -C kernel_source rev-parse --short HEAD 2>/dev/null || echo 'unknown')"

    - name: Ensure Toolchain
      run: |
        if [ -d clang/.git ]; then
          echo "clang already prepared"
        else
          rm -rf clang
          git clone --depth=1 https://gitlab.com/LeCmnGend/proton-clang.git -b clang-13 clang
        fi

    - name: Set up Environment
      run: |
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
        echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        ccache -M 5G

    - name: Prepare Kernel Source for Module Build (MIUI Default)
      working-directory: ./kernel_source
      run: |
        # Get device from input
        DEVICE="${{ inputs.device }}"
        DEFCONFIG="${DEVICE}_defconfig"
        DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
        
        if [ ! -f "$DEFCONFIG_PATH" ]; then
          echo "❌ Defconfig not found: $DEFCONFIG_PATH"
          echo "Available defconfigs:"
          ls arch/arm64/configs/ | grep -E "(_defconfig$|defconfig$)" || echo "No defconfigs found"
          exit 1
        fi
        echo "✅ Using defconfig: $DEFCONFIG"
        
        # Reset module directory and copy your module source
        rm -rf drivers/hack
        mkdir -p drivers/hack
        
        # Copy your module source from the repo
        if [ -d "../${{ inputs.module_path }}" ]; then
          echo "📂 Copying module from: ../${{ inputs.module_path }}"
          cp -a ../${{ inputs.module_path }}/. drivers/hack/
        else
          echo "❌ Module source not found at: ${{ inputs.module_path }}"
          echo "Available directories in repo root:"
          ls -la ../
          exit 1
        fi
        
        # Check for Makefile
        if [ ! -f "drivers/hack/Makefile" ]; then
          echo "❌ Makefile not found in module source!"
          echo "Creating default Makefile..."
          cat > drivers/hack/Makefile << 'EOF'
          obj-m += kernel_module.o
          kernel_module-objs := main.o
          EOF
        fi
        
        # Create Kconfig if it doesn't exist
        if [ ! -f "drivers/hack/Kconfig" ]; then
          echo "⚠️ Kconfig not found, creating one..."
          cat > drivers/hack/Kconfig << 'EOF'
          config KERNEL_HACK
                  tristate "Kernel Hack Module"
                  help
                    Custom kernel module for munch device.
                    Say Y/M here to enable.
          EOF
        fi
        
        # Add module to Kconfig and Makefile (idempotent)
        grep -q 'source "drivers/hack/Kconfig"' drivers/Kconfig || \
          echo 'source "drivers/hack/Kconfig"' >> drivers/Kconfig
        grep -q 'obj-$(CONFIG_KERNEL_HACK) += hack/' drivers/Makefile || \
          echo 'obj-$(CONFIG_KERNEL_HACK) += hack/' >> drivers/Makefile
        
        # Configure the kernel with the correct defconfig
        echo "📋 Configuring kernel with $DEFCONFIG..."
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
        
        # ==========================================
        # Apply MIUI-specific DTS patches (MIUI default)
        # ==========================================
        if [ "${{ inputs.target_os }}" == "miui" ] || [ "${{ inputs.target_os }}" == "both" ]; then
          echo "🔧 Applying MIUI DTS patches..."
          
          DTS_SOURCE="arch/arm64/boot/dts/vendor/qcom"
          DTS_BACKUP=".dts.bak.miui"
          
          cp -a "${DTS_SOURCE}" "${DTS_BACKUP}"
          
          # Apply MIUI specific sed patches to dts
          sed -i 's/<154>/<1537>/g' ${DTS_SOURCE}/dsi-panel-j1s* || true
          sed -i 's/<154>/<1537>/g' ${DTS_SOURCE}/dsi-panel-j2* || true
          sed -i 's/<155>/<1544>/g' ${DTS_SOURCE}/dsi-panel-j3s-37-02-0a-dsc-video.dtsi || true
          sed -i 's/<155>/<1545>/g' ${DTS_SOURCE}/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi || true
          sed -i 's/<155>/<1546>/g' ${DTS_SOURCE}/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi || true
          sed -i 's/<155>/<1546>/g' ${DTS_SOURCE}/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi || true
          sed -i 's/<70>/<695>/g' ${DTS_SOURCE}/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi || true
          sed -i 's/<70>/<695>/g' ${DTS_SOURCE}/dsi-panel-j3s-37-02-0a-dsc-video.dtsi || true
          sed -i 's/<70>/<695>/g' ${DTS_SOURCE}/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi || true
          sed -i 's/<70>/<695>/g' ${DTS_SOURCE}/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi || true
          sed -i 's/<71>/<710>/g' ${DTS_SOURCE}/dsi-panel-j1s* || true
          sed -i 's/<71>/<710>/g' ${DTS_SOURCE}/dsi-panel-j2* || true
          
          echo "✅ MIUI DTS patches applied"
        fi
        
        # ==========================================
        # KernelSU Configurations
        # ==========================================
        if [ "${{ inputs.ksu }}" == "true" ]; then
          echo "🔧 Enabling KernelSU (ReSukiSU) support..."
          scripts/config --file out/.config \
            -e KSU \
            -e THREAD_INFO_IN_TASK \
            -e KSU_SUSFS
        fi
        
        # ==========================================
        # Target OS specific configurations
        # ==========================================
        if [ "${{ inputs.target_os }}" == "miui" ] || [ "${{ inputs.target_os }}" == "both" ]; then
          echo "🔧 Applying MIUI specific configurations..."
          scripts/config --file out/.config \
            --set-str STATIC_USERMODEHELPER_PATH /system/bin/micd \
            -e PERF_CRITICAL_RT_TASK \
            -e SF_BINDER \
            -e OVERLAY_FS \
            -e MIGT \
            -e MIGT_ENERGY_MODEL \
            -e MIHW \
            -e PACKAGE_RUNTIME_INFO \
            -e BINDER_OPT \
            -e KPERFEVENTS \
            -e PERF_HUMANTASK \
            -d LTO_CLANG \
            -e LTO_NONE \
            -d SHADOW_CALL_STACK \
            -e XIAOMI_MIUI \
            -d MI_MEMORY_SYSFS \
            -e TASK_DELAY_ACCT \
            -e MIUI_ZRAM_MEMORY_TRACKING \
            -e PERF_HELPER \
            -e BOOTUP_RECLAIM \
            -e MI_RECLAIM \
            -e RTMM \
            -e MILLET_CGROUP \
            -e MILLET_SIG \
            -e MILLET_BINDER \
            -e MILLET_PKG \
            -e MILLET_BINDER_GKI \
            -e MILLET_CORE \
            -e MILLET_HS \
            -e BINDER_PRIO \
            -d REKERNEL \
            -d REKERNEL_NETWORK
        fi
        
        if [ "${{ inputs.target_os }}" == "aosp" ] || [ "${{ inputs.target_os }}" == "both" ]; then
          echo "🔧 Applying AOSP specific configurations..."
          scripts/config --file out/.config \
            -e REKERNEL \
            -e REKERNEL_NETWORK
        fi
        
        # Enable the module config
        scripts/config --file out/.config --enable "${{ inputs.module_config }}"
        
        # Regenerate config
        echo "🔄 Regenerating config with olddefconfig..."
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # Show kernel version and verify config
        echo "=== Kernel Version ==="
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- kernelrelease
        
        echo "=== Module Config Status ==="
        grep "${{ inputs.module_config }}" out/.config || echo "⚠️ Module config not found!"

    - name: Build Kernel Module
      working-directory: ./kernel_source
      run: |
        export KBUILD_BUILD_VERSION=""
        export KBUILD_BUILD_TIMESTAMP=""
        
        echo "=== Building modules_prepare ==="
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld modules_prepare
        
        echo "=== Building kernel module ==="
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld M=drivers/hack \
          EXTRA_CFLAGS="-Wno-error -Wno-unused-variable -Wno-unused-but-set-variable -Wno-missing-attributes -Wno-attributes -Wno-int-conversion -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" || {
            echo "⚠️ Build with clang had warnings, trying without extra flags..."
            make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld M=drivers/hack || exit 1
        }
        
        # Find and show the built modules
        echo "=== Built modules ==="
        find out/drivers/hack -name "*.ko" -ls 2>/dev/null || echo "❌ No modules found!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule
        path: kernel_source/out/drivers/hack/*.ko

    - name: Package Module
      if: success()
      shell: bash
      run: |
        shopt -s nullglob
        KOS=(kernel_source/out/drivers/hack/*.ko)
        if [ ${#KOS[@]} -eq 0 ]; then
          echo "❌ No .ko files found!"
          echo "Checking build output..."
          find kernel_source/out -name "*.ko" 2>/dev/null || echo "No .ko files anywhere"
          exit 1
        fi
        
        echo "Found ${#KOS[@]} module(s)"
        for ko in "${KOS[@]}"; do
          echo "Module: $ko"
          modinfo "$ko" 2>/dev/null || echo "Could not read modinfo"
        done
        
        # Get vermagic from first module
        KO="${KOS[0]}"
        VERMAGIC="$(modinfo -F vermagic "$KO" 2>/dev/null | tr -d '\n' | awk '{print $1}' || echo 'unknown')"
        echo "vermagic: $VERMAGIC"
        
        # Get device name
        DEVICE="${{ inputs.device }}"
        TARGET_OS="${{ inputs.target_os }}"
        KSU_STATUS="${{ inputs.ksu && 'ReSukiSU' || 'NoKernelSU' }}"
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        
        # Create zip filename
        ZIPNAME="${DEVICE}_module_${TARGET_OS}_${KSU_STATUS}_${VERMAGIC}_${TIMESTAMP}.zip"
        
        mkdir -p dist
        # Copy module files with a README
        cd kernel_source/out/drivers/hack
        
        cat > README.txt << EOF
        ==========================================
        Kernel Module for ${DEVICE}
        ==========================================
        
        Build Information:
        - Device: ${DEVICE}
        - Target OS: ${TARGET_OS}
        - KernelSU: ${KSU_STATUS}
        - Vermagic: ${VERMAGIC}
        - Build Date: $(date -u)
        - GitHub Run: ${{ github.run_id }}
        
        Modules Included:
        $(ls -la *.ko 2>/dev/null)
        
        Installation:
        1. Copy module to device
        2. insmod <module_name>.ko
        
        Verification:
        modinfo <module_name>.ko
        
        ==========================================
        EOF
        
        zip -9 "../../../dist/${ZIPNAME}" ./*.ko README.txt 2>/dev/null || {
          echo "⚠️ Could not create zip, trying without README..."
          zip -9 "../../../dist/${ZIPNAME}" ./*.ko 2>/dev/null
        }
        
        cd ../../..
        echo "Created: dist/${ZIPNAME}"
        echo "ZIP_NAME=${ZIPNAME}" >> $GITHUB_ENV
        echo "ZIP_PATH=dist/${ZIPNAME}" >> $GITHUB_ENV
        echo "VERMAGIC=${VERMAGIC}" >> $GITHUB_ENV
        
        echo "### 📊 Module Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Device** | ${DEVICE} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Target OS** | ${TARGET_OS} |" >> $GITHUB_STEP_SUMMARY
        echo "| **KernelSU** | ${KSU_STATUS} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Vermagic** | ${VERMAGIC} |" >> $GITHUB_STEP_SUMMARY
        echo "| **ZIP** | \`${ZIPNAME}\` |" >> $GITHUB_STEP_SUMMARY

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule-Zip-${{ inputs.device }}-${{ github.run_id }}
        path: ${{ env.ZIP_PATH }}
        compression-level: 0
