name: Build Kernel Module

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'munch'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      ksu:
        description: 'Enable KernelSU (ReSukiSU) support in module'
        required: true
        type: boolean
        default: false
      module_path:
        description: 'Path to your LKM source code (路径)'
        required: true
        default: 'kernel'
        type: string
      module_config:
        description: 'Kconfig symbol for your module (e.g., CONFIG_KERNEL_HACK)'
        required: true
        default: 'CONFIG_KERNEL_HACK'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04  # Match kernel build environment

    steps:
    - name: Checkout Module Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git curl wget bison flex zip bc cpio \
          libssl-dev ccache tar python-is-python3

    - name: Setup ZyCromerZ Clang 16
      run: |
        mkdir -p "$HOME/zyc-clang"
        cd "$HOME/zyc-clang"
        curl -LO "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz"
        if [ ! -s "Clang-16.0.6-20260510.tar.gz" ]; then
          echo "::error::Download failed!"
          exit 1
        fi
        tar -xzf "Clang-16.0.6-20260510.tar.gz"
        rm -f "Clang-16.0.6-20260510.tar.gz"
        if [ ! -x "$HOME/zyc-clang/bin/clang" ]; then
          echo "::error::Clang not found!"
          exit 1
        fi
        echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

    - name: Cache Dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          kernel_source
          ~/.ccache
        key: ${{ runner.os }}-kernel-munch-${{ hashFiles('**/Makefile', '**/Kconfig') }}
        restore-keys: |
          ${{ runner.os }}-kernel-munch-

    - name: Ensure Kernel Source
      run: |
        if [ -d kernel_source/.git ]; then
          echo "kernel_source already prepared"
          cd kernel_source
          git fetch --depth=1 origin android16-pitchkernel 2>/dev/null || true
          git checkout android16-pitchkernel 2>/dev/null || git checkout HEAD
          cd ..
        else
          rm -rf kernel_source
          git clone --depth=1 --single-branch -b android16-pitchkernel \
            https://github.com/MujinnPark/android_kernel_xiaomi_sm8250.git kernel_source
        fi
        echo "Kernel commit: $(git -C kernel_source rev-parse --short HEAD 2>/dev/null || echo 'unknown')"

    - name: Download Kernel Build Artifacts
      run: |
        # You'll need to provide the URL of the kernel ZIP from your PitchKernel build
        # or download it from the artifacts section
        mkdir -p kernel_artifacts
        # Add your download logic here

    - name: Prepare Kernel Source for Module Build
      working-directory: ./kernel_source
      run: |
        # Get device from input
        DEVICE="${{ inputs.device }}"
        DEFCONFIG="${DEVICE}_defconfig"
        DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
        
        if [ ! -f "$DEFCONFIG_PATH" ]; then
          echo "❌ Defconfig not found: $DEFCONFIG_PATH"
          exit 1
        fi
        echo "✅ Using defconfig: $DEFCONFIG"
        
        # Set PitchKernel vermagic
        echo "-pitchkernel" > localversion-st
        echo "" > localversion-cip
        
        # Remove existing localversion from defconfig
        sed -i 's/CONFIG_LOCALVERSION="-aptusitu-perf"/CONFIG_LOCALVERSION=""/' "$DEFCONFIG_PATH" || true
        
        # Copy module source
        rm -rf drivers/hack
        mkdir -p drivers/hack
        if [ -d "../${{ inputs.module_path }}" ]; then
          cp -a ../${{ inputs.module_path }}/. drivers/hack/
        else
          echo "❌ Module source not found at: ${{ inputs.module_path }}"
          exit 1
        fi
        
        # Auto-patches (keep your existing patches here)
        if [ -f "drivers/hack/touch_input.c" ]; then
          sed -i 's/evt->time\.tv_sec/evt->input_event_sec/g' drivers/hack/touch_input.c
          sed -i 's/evt->time\.tv_usec/evt->input_event_usec/g' drivers/hack/touch_input.c
        fi
        
        # Add module to Kconfig and Makefile
        grep -q 'source "drivers/hack/Kconfig"' drivers/Kconfig || \
          echo 'source "drivers/hack/Kconfig"' >> drivers/Kconfig
        grep -q 'obj-$(CONFIG_KERNEL_HACK) += hack/' drivers/Makefile || \
          echo 'obj-$(CONFIG_KERNEL_HACK) += hack/' >> drivers/Makefile
        
        # Configure the kernel
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
        
        # Copy Module.symvers from kernel artifacts (CRITICAL!)
        if [ -f "../kernel_artifacts/extracted/Module.symvers" ]; then
          cp ../kernel_artifacts/extracted/Module.symvers out/Module.symvers
          echo "✅ Copied Module.symvers"
        else
          echo "⚠️ WARNING: Module.symvers not found! Module may not load."
        fi
        
        # Set PitchKernel vermagic in config
        scripts/config --file out/.config --disable LOCALVERSION_AUTO
        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-pitchkernel"
        
        # Enable the module
        scripts/config --file out/.config --enable "${{ inputs.module_config }}"
        
        # Regenerate config
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # Show kernel version
        echo "=== Kernel Version ==="
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- kernelrelease

    - name: Build Kernel Module
      working-directory: ./kernel_source
      run: |
        export KBUILD_BUILD_VERSION=""
        export KBUILD_BUILD_TIMESTAMP=""
        
        echo "=== Building modules_prepare ==="
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld modules_prepare
        
        echo "=== Building kernel module ==="
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld M=drivers/hack
        
        echo "=== Built modules ==="
        find out/drivers/hack -name "*.ko" -ls 2>/dev/null || echo "❌ No modules found!"

    - name: Package Module
      if: success()
      shell: bash
      run: |
        shopt -s nullglob
        KOS=(kernel_source/out/drivers/hack/*.ko)
        if [ ${#KOS[@]} -eq 0 ]; then
          echo "❌ No .ko files found!"
          exit 1
        fi
        
        KO="${KOS[0]}"
        VERMAGIC="$(modinfo -F vermagic "$KO" 2>/dev/null | tr -d '\n' | awk '{print $1}' || echo 'unknown')"
        DEVICE="${{ inputs.device }}"
        TARGET_OS="${{ inputs.target_os }}"
        KSU_STATUS="${{ inputs.ksu && 'ReSukiSU' || 'NoKernelSU' }}"
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        ZIPNAME="${DEVICE}_module_${TARGET_OS}_${KSU_STATUS}_${VERMAGIC}_${TIMESTAMP}.zip"
        
        mkdir -p dist
        PACKAGE_DIR="package_${TIMESTAMP}"
        mkdir -p "${PACKAGE_DIR}"
        cp "${KOS[@]}" "${PACKAGE_DIR}/"
        
        cat > "${PACKAGE_DIR}/README.txt" << EOF
        Kernel Module for ${DEVICE}
        Build Date: $(date -u)
        Vermagic: ${VERMAGIC}
        Target OS: ${TARGET_OS}
        KernelSU: ${KSU_STATUS}
        EOF
        
        cd "${PACKAGE_DIR}"
        zip -r9 "../dist/${ZIPNAME}" ./*
        cd ..
        rm -rf "${PACKAGE_DIR}"
        
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "ZIP_PATH=dist/${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelModule-Zip-${{ inputs.device }}-${{ github.run_id }}
        path: ${{ env.ZIP_PATH }}
        compression-level: 0
