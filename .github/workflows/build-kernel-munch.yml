name: A Munch Kernel Driver Builder

permissions:
  contents: write

on: 
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "Kernel Source Git URL"
        required: true
        default: "https://github.com/NKR00711/kernel_xiaomi_sm8250_mod"
      kernel_ref:
        description: "Branch / tag / commit (optional)"
        required: false
        default: ""
      defconfig:
        description: "Defconfig name (e.g. munch_defconfig)"
        required: true
        default: "munch_defconfig"
      disable_modversions:
        description: "Disable MODVERSIONS (and related options) via scripts/config"
        required: false
        default: true
        type: boolean
      vermagic_custom:
        description: "Custom vermagic string (e.g., 4.19.325-cip130-st14-aptusitu-perf-gc0fd5eb8c999). Leave empty to auto-detect from kernelsrc source"
        required: false
        default: ""
        type: string
      upload_release:
        description: "Upload zip to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libelf-dev bc bison flex libssl-dev zip kmod
    
    - name: Download kernelsrc
      run: |
        set -euxo pipefail
        rm -rf kernelsrc
        if [ -z "${{ inputs.kernel_ref }}" ]; then
          git clone --depth=1 --recurse-submodules --shallow-submodules "${{ inputs.kernel_url }}" kernelsrc
        else
          if git ls-remote --heads --tags "${{ inputs.kernel_url }}" "${{ inputs.kernel_ref }}" | grep -q .; then
            git clone --depth=1 --branch "${{ inputs.kernel_ref }}" "${{ inputs.kernel_url }}" kernelsrc
          else
            git clone "${{ inputs.kernel_url }}" kernelsrc
            cd kernelsrc
            git checkout "${{ inputs.kernel_ref }}"
          fi
        fi
        echo "Kernel branch: $(git branch --show-current)"
        echo "Kernel commit: $(git rev-parse --short HEAD)"
    
    - name: Configure kernelsrc with custom vermagic
      run: |
        set -euxo pipefail
        cd kernelsrc

        DEFCONFIG_INPUT="${{ inputs.defconfig }}"
        DEFCONFIG_NAME="$(basename "$DEFCONFIG_INPUT")"
        test -f "arch/arm64/configs/$DEFCONFIG_NAME"
        
        # CRITICAL: Remove ALL files that influence version
        echo "=== Removing all version-related files ==="
        rm -f localversion* .scmversion .version
        # Also remove any files in the root that might affect version
        find . -maxdepth 1 -name "localversion*" -delete 2>/dev/null || true
        
        # Handle vermagic configuration
        if [ -n "${{ inputs.vermagic_custom }}" ]; then
          echo "=== Using custom vermagic: ${{ inputs.vermagic_custom }} ==="
          
          VERMAGIC_CUSTOM="${{ inputs.vermagic_custom }}"
          
          # Extract the base version (e.g., 4.19.325)
          BASE_VERSION=$(echo "$VERMAGIC_CUSTOM" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          
          # Extract the EXTRAVERSION part (everything after the base version)
          EXTRA_VERSION=$(echo "$VERMAGIC_CUSTOM" | sed "s/^$BASE_VERSION//")
          
          # Extract just the git hash part (the 'g' + 12 hex chars)
          if [[ "$VERMAGIC_CUSTOM" =~ (g[0-9a-f]{12}) ]]; then
            GIT_HASH="${BASH_REMATCH[1]}"
            echo "Detected git hash: $GIT_HASH"
            # Remove the git hash from EXTRA_VERSION if present
            EXTRA_VERSION=$(echo "$EXTRA_VERSION" | sed "s/$GIT_HASH//")
          else
            GIT_HASH=""
          fi
          
          # Clean up EXTRA_VERSION - remove any trailing dashes
          EXTRA_VERSION=$(echo "$EXTRA_VERSION" | sed 's/-$//')
          
          echo "=== Parsed components ==="
          echo "BASE_VERSION: $BASE_VERSION"
          echo "EXTRA_VERSION: $EXTRA_VERSION"
          echo "GIT_HASH: $GIT_HASH"
          
          # Set the base version in Makefile
          sed -i 's/^VERSION =.*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 325/' Makefile
          
          # Set EXTRAVERSION
          if [ -n "$EXTRA_VERSION" ]; then
            sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = $EXTRA_VERSION/" Makefile
          else
            sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = /' Makefile
          fi
          
          # CRITICAL: Disable git-based version detection
          # Create a .scmversion file with exactly what we want (or empty)
          if [ -n "$GIT_HASH" ]; then
            # If we have a custom git hash, use it
            echo "$GIT_HASH" > .scmversion
          else
            # If no git hash, make it empty to prevent automatic git detection
            echo "" > .scmversion
          fi
          
          # CRITICAL: Also set KBUILD_BUILD_VERSION to prevent git detection
          export KBUILD_BUILD_VERSION=""
          export KBUILD_BUILD_TIMESTAMP=""
          
          echo "=== Modified Makefile version ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =" Makefile
          echo "=== .scmversion content ==="
          cat .scmversion || echo "No .scmversion file"
          
        else
          echo "=== No custom vermagic provided, using kernelsrc source default ==="
        fi
        
        # Set config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG_NAME"
        
        # CRITICAL: Override CONFIG_LOCALVERSION in the config
        echo "=== Overriding CONFIG_LOCALVERSION ==="
        ./scripts/config --set-str CONFIG_LOCALVERSION ""
        
        # Disable MODVERSIONS if requested
        if [[ "${{ inputs.disable_modversions }}" == "true" ]]; then
          echo "=== Disabling MODVERSIONS ==="
          ./scripts/config --disable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_ASM_MODVERSIONS
          ./scripts/config --disable CONFIG_MODULE_SRCVERSION_ALL
          ./scripts/config --disable CONFIG_MODULE_FORCE_LOAD
        fi
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # Show what CONFIG_LOCALVERSION is set to
        echo "=== CONFIG_LOCALVERSION value ==="
        grep "^CONFIG_LOCALVERSION=" .config || echo "CONFIG_LOCALVERSION not set"
        
        # Show the version that will be built
        echo "=== Kernel version being built ==="
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease
        
        # Prepare
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
    
    - name: Build module
      run: |
        KERNEL_DIR=$(pwd)/kernelsrc
        MODULE_SRC=$(pwd)/kernel
        
        cd "$KERNEL_DIR"
        # Export variables to prevent git detection during module build
        export KBUILD_BUILD_VERSION=""
        export KBUILD_BUILD_TIMESTAMP=""
        
        # Build with -Wno-error to treat warnings as warnings, not errors
        make -C "$KERNEL_DIR" M="$MODULE_SRC" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          KBUILD_BUILD_VERSION="" \
          KBUILD_BUILD_TIMESTAMP="" \
          EXTRA_CFLAGS="-Wno-error -Wno-unused-variable -Wno-format-extra-args" \
          modules -j$(nproc)
        
        # Strip debug symbols
        aarch64-linux-gnu-strip --strip-debug "$MODULE_SRC"/*.ko 2>/dev/null || true
    
    - name: Verify build and show vermagic
      run: |
        echo "=== Module info ==="
        modinfo kernel/*.ko 2>/dev/null || echo "No modules found"
        
        echo ""
        echo "=== Module vermagic ==="
        modinfo -F vermagic kernel/*.ko 2>/dev/null || echo "Could not read vermagic"
        
        echo ""
        echo "✅ SUCCESS: Module compiled!"

    - name: Package kernelsrc module (zip named from vermagic)
      id: package
      shell: bash
      run: |
        set -euxo pipefail
        shopt -s nullglob
        KOS=(kernel/*.ko)
        if [ ${#KOS[@]} -eq 0 ]; then
          echo "No .ko built, skipping packaging."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        KO="${KOS[0]}"
        VERMAGIC="$(modinfo -F vermagic "$KO" | tr -d '\n' 2>/dev/null || echo 'unknown')"
        echo "vermagic: $VERMAGIC"

        # Clean the vermagic for use as filename
        KREL="$(echo "$VERMAGIC" | awk '{print $1}' | sed 's/+/_/g' | sed 's/\//_/g')"
        
        MODNAME="nkrkdm"
        ZIPNAME="${KREL}-${MODNAME}-kernelsrc-driver.zip"

        mkdir -p dist
        rm -f "dist/$ZIPNAME"
        (cd kernel && zip -9 "../dist/$ZIPNAME" ./*.ko 2>/dev/null)

        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "tag_name=$KREL" >> "$GITHUB_OUTPUT"
        echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"
        echo "zippath=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"
    
    - name: Upload .ko as artifact
      if: steps.package.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kernelsrc-driver
        path: kernel/*.ko

    - name: Generate release notes (modinfo)
      if: steps.package.outputs.found == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p dist
        {
          echo "### Build sources"
          echo ""
          echo "- Kernel source URL: ${{ inputs.kernel_url }}"
          if [[ -n "${{ inputs.kernel_ref }}" ]]; then
            echo "- Kernel ref: ${{ inputs.kernel_ref }}"
          fi
          if [[ -n "${{ inputs.vermagic_custom }}" ]]; then
            echo "- Custom vermagic: ${{ inputs.vermagic_custom }}"
          fi
          echo ""
          echo "### Module info"
          echo ""
          echo '```'
          modinfo kernel/*.ko 2>/dev/null || echo "No modules found"
          echo '```'
          echo ""
          echo "### Module vermagic"
          echo ""
          echo '```'
          modinfo -F vermagic kernel/*.ko 2>/dev/null || echo "Could not read vermagic"
          echo '```'
        } > dist/release_notes.md

    - name: Upload zip to GitHub Release (tag from vermagic)
      if: steps.package.outputs.found == 'true' && inputs.upload_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.package.outputs.tag_name }}
        name: ${{ steps.package.outputs.tag_name }}
        files: ${{ steps.package.outputs.zippath }}
        body_path: dist/release_notes.md
        draft: false
        prerelease: false
